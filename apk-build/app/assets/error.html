<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>اتصال برقرار نشد</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #16295c 0%, #0A1633 55%, #060d22 100%);
    color:#fff; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; user-select:none;
  }
  .card { max-width:420px; width:100%; }
  .crown { font-size:64px; filter: drop-shadow(0 0 18px rgba(240,190,80,.55)); }
  h1 {
    margin:14px 0 10px; font-size:24px;
    background: linear-gradient(180deg,#ffe9a8,#d9a63f 60%,#b07d1f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p { color:#c7d2ee; font-size:15px; line-height:1.9; margin-bottom:22px; }
  button {
    font-family:inherit; font-size:17px; font-weight:700; color:#1a1205;
    padding:14px 40px; border:0; border-radius:14px; cursor:pointer;
    background: linear-gradient(180deg,#ffdf8e,#e3b153 55%,#c98f2c);
    box-shadow: 0 6px 20px rgba(227,177,83,.35), inset 0 1px 0 rgba(255,255,255,.6);
  }
  button:active { transform: translateY(1px); }
  .hint { margin-top:18px; font-size:12.5px; color:#8fa0cc; }
</style>
</head>
<body>
  <div class="card">
    <div class="crown">👑</div>
    <h1>اتصال برقرار نشد</h1>
    <p>برای ورود به عرصه‌ی سلطنت به اینترنت نیاز داری.<br>اتصال خود را بررسی کن و دوباره تلاش کن.</p>
    <button onclick="retry()">تلاش مجدد</button>
    <div class="hint">ورلد دامین — نبرد برای تخت جهان</div>
  </div>
  <script>
    function retry(){ location.href='https://world-dominion7.vercel.app/game/index.html'; }
  </script>
</body>
</html>
